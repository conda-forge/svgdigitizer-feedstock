{% set name = "svgdigitizer" %}
{% set version = "0.16.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/svgdigitizer-{{ version }}.tar.gz
  sha256: 62d2b3f730d347efe3320c8195377ddc372c050ea47381af7d862e0692c4f655

build:
  entry_points:
    - svgdigitizer=svgdigitizer.entrypoint:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - astropy-base >=5.0.5,<9
    # https://github.com/echemdb/svgdigitizer/issues/152
    - click >=8,<9
    - frictionless >=5.8.3,<6
    - latexcodec >=2.0.1
    - matplotlib-base >=3.6,<4
    - mergedeep >=1.3.4,<2
    - pandas >=1.5,<4
    - pillow >=13,<14
    - pybtex >=0.25,<0.27
    - pymupdf >=1.27.1,<3
    - python >={{ python_min }}
    - pyyaml >=6,<7
    - requests >2,<3
    - scipy >=1.9.2,<2
    - svg.path >=4.1,<8
    - svgpathtools >=1.4,<2
    - svgwrite >=1.4,<2

test:
  imports:
    - svgdigitizer
  commands:
    - pip check
    - svgdigitizer --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/svgdigitizer/
  summary: svgdigitizer is a Python library and command line tool to recover the measured data underlying plots in scientific publications.
  license: GPL-3.0-or-later
  license_file: LICENSE
  doc_url: https://echemdb.github.io/svgdigitizer/
  dev_url: https://github.com/echemdb/svgdigitizer

extra:
  recipe-maintainers:
    - nicohoermann
    - linuxrider
    - DunklesArchipel
    - saraedum
